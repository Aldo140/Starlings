name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Set base path
        id: repo
        run: |
          # starlingsmap.ca is a custom domain served at the root — not a
          # /reponame/ subpath — so base must always be "/" now that a
          # CNAME file (public/CNAME) pins the custom domain. This also
          # means the old https://aldo140.github.io/Starlings/ URL will no
          # longer load correctly (its asset paths expect a /Starlings/
          # prefix); starlingsmap.ca is the canonical URL going forward.
          echo "base=/" >> $GITHUB_OUTPUT
      
      - name: Build
        env:
          GITHUB_PAGES_BASE: ${{ steps.repo.outputs.base }}
        run: npm run build
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
